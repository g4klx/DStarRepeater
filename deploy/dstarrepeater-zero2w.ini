# D-Star Repeater configuration for a Raspberry Pi Zero 2 W with an SX1255 HAT.
# Author: Karel Kadlec (OK1LBC) <xkk@post.cz>
#
# Install to: /etc/dstarrepeater/dstarrepeater.ini

[General]
# Your repeater callsign (8 characters + optional module letter).
Callsign=GB3IN  C
Gateway=
# 0=Duplex, 1=Simplex, 2=Gateway, 3=TXOnly, 4=RXOnly, 5=TX+RX
Mode=0
# 0=None, 1=BER, 2=Status
Ack=1
Restriction=0
RPT1Validation=1
DTMFBlanking=1
ErrorReply=1

[Log]
FilePath=/var/log
FileLevel=2
DisplayLevel=2
MQTTLevel=2

[Paths]
Data=/usr/share/dstarrepeater
Audio=/var/log

[Network]
GatewayAddress=127.0.0.1
GatewayPort=20010
LocalAddress=127.0.0.1
LocalPort=20011
Name=

[Modem]
# SX1255 = direct I/Q D-STAR modem over I2S/SPI.
Type=SX1255

[SX1255]
# ALSA I/Q devices created by the genericstereoaudiocodec overlay.
RXDevice=hw:GenericStereoAu,1,0
TXDevice=hw:GenericStereoAu,0,0
SPIDevice=/dev/spidev0.0
SPISpeed=500000

# Reset pin on the Pi Zero 2 W:
#   libgpiod:  /dev/gpiochip0 line 25  (BCM GPIO_25)
#   sysfs:     global number 537       (base 512 + 25)
ResetChip=/dev/gpiochip0
ResetLine=25
ResetGPIO=537

# PA PTT output (BCM GPIO_17 = header pin 11).  Driven high while transmitting
# and low while idle; set PTTInvert=1 for an active-low PA key line.
PTTChip=/dev/gpiochip0
PTTLine=17
PTTInvert=0

# Repeater frequencies in Hz (SX1255 range: 410-510 MHz).
RXFrequency=430975020
TXFrequency=438575000

# RX synthesiser is tuned RXFrequency+RXShift; the mixer brings the signal to
# DC and avoids the LO spike.  Keep -25000 unless you know what you are doing.
RXShift=-25000

# Peak GMSK deviation.  D-Star h=0.5 at 4800 baud => 1200 Hz.
TXDeviation=1200
RXInvert=0
TXInvert=0
RXLevel=1.0
TXLevel=1.0
TXDelay=150
TXTail=50

[Times]
Timeout=180
AckTime=500

[Beacon]
Time=600
Text=D-Star Repeater
Voice=0
Language=0

[Announcement]
Enabled=0
Time=500
RecordRPT1=
RecordRPT2=
DeleteRPT1=
DeleteRPT2=

[Control]
Enabled=0
RPT1=
RPT2=
Shutdown=
Startup=
Status1=
Status2=
Status3=
Status4=
Status5=
Command1=
Command1Line=
Command2=
Command2Line=
Command3=
Command3Line=
Command4=
Command4Line=
Command5=
Command5Line=
Command6=
Command6Line=
Output1=
Output2=
Output3=
Output4=

# The SX1255 modem handles RX/TX switching itself over SPI, so no external
# PTT controller is required.
[Controller]
Type=
SerialConfig=1
PTTInvert=0
ActiveHangTime=0

[Outputs]
Output1=0
Output2=0
Output3=0
Output4=0

[Frame Logging]
Enabled=0
